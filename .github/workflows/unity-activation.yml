name: Unity License Activation (run once)

# Run this workflow manually ONE TIME to generate your UNITY_LICENSE secret.
# After saving the secret you can delete or disable this workflow.
#
# Steps:
#   1. Go to Actions -> "Unity License Activation (run once)" -> Run workflow
#   2. Download the artifact "unity-activation-file"
#   3. Open the .alf file at https://license.unity3d.com/manual
#      and log in with your Unity account to get a .ulf licence file
#   4. Copy the entire contents of the .ulf file
#   5. In your repo go to Settings -> Secrets -> Actions -> New secret
#      Name: UNITY_LICENSE   Value: (paste the .ulf contents)
#   6. Also add UNITY_EMAIL and UNITY_PASSWORD secrets (your Unity account credentials)

on:
  workflow_dispatch:

jobs:
  activation:
    name: Generate Unity licence request file
    runs-on: macos-latest
    steps:
      - name: Request Unity licence file (.alf)
        uses: game-ci/unity-request-activation-file@v2
        with:
          unityVersion: 6000.4.1f1

      - name: Upload .alf for manual activation
        uses: actions/upload-artifact@v4
        with:
          name: unity-activation-file
          path: '*.alf'
          retention-days: 1
